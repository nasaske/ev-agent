<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280"
     viewBox="0 0 920 280" role="img" aria-labelledby="title description">
  <title id="title">Scrubber calibration against a real corpus</title>
  <desc id="description">False positives fell from 100 percent to 62 percent to 42 percent over three rounds: path characters matched whole file paths, then git SHAs and camelCase names, leaving mostly real credentials.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>

    <linearGradient id="cal-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E01B3D"/>
      <stop offset="1" stop-color="#1B4DE0"/>
    </linearGradient>

    <filter id="cal-lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0E1622" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="920" height="280" fill="#FFFFFF"/>
  <rect x="8" y="8" width="904" height="264" rx="18" fill="#FFFFFF" stroke="#E2E8F2" filter="url(#cal-lift)"/>

  <g transform="translate(42 40)">
    <rect x="0" y="-11" width="28" height="3" rx="1.5" fill="url(#cal-rule)"/>
    <text class="mono" x="0" y="12" font-size="11.5" fill="#64748B" letter-spacing="1.6">CALIBRATION</text>
  </g>

  <g class="mono" text-anchor="end">
    <text x="878" y="52" font-size="11" fill="#94A3B8" letter-spacing="0.8">TUNED ON REAL DATA, NOT THEORY</text>
  </g>

  <g>
    <text class="mono" x="42" y="98" font-size="11" fill="#94A3B8" letter-spacing="0.9">ROUND 1</text>
    <rect x="132" y="84" width="620" height="20" rx="5" fill="#F4F6FA"/>
    <rect x="132" y="84" width="0" height="20" rx="5" fill="#E01B3D">
      <animate attributeName="width" values="0;620;620;620" keyTimes="0;0.18;0.92;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="768" y="99" font-size="14" fill="#E01B3D">100%</text>
    <text class="sans" x="132" y="122" font-size="11" fill="#8A97A8">the character class included “/”, so whole file paths matched as one token</text>
  </g>

  <g>
    <text class="mono" x="42" y="168" font-size="11" fill="#94A3B8" letter-spacing="0.9">ROUND 2</text>
    <rect x="132" y="154" width="620" height="20" rx="5" fill="#F4F6FA"/>
    <rect x="132" y="154" width="0" height="20" rx="5" fill="#E8536E">
      <animate attributeName="width" values="0;0;384;384;384" keyTimes="0;0.22;0.40;0.92;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="768" y="169" font-size="14" fill="#E8536E">62%</text>
    <text class="sans" x="132" y="192" font-size="11" fill="#8A97A8">git SHAs and camelCase function names still read as high entropy</text>
  </g>

  <g>
    <text class="mono" x="42" y="238" font-size="11" fill="#94A3B8" letter-spacing="0.9">ROUND 3</text>
    <rect x="132" y="224" width="620" height="20" rx="5" fill="#F4F6FA"/>
    <rect x="132" y="224" width="0" height="20" rx="5" fill="#1B4DE0">
      <animate attributeName="width" values="0;0;260;260;260" keyTimes="0;0.44;0.62;0.92;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="768" y="239" font-size="14" fill="#1B4DE0">42%</text>
    <text class="sans" x="132" y="262" font-size="11" fill="#8A97A8">what remains is real: Fernet tokens, OAuth refresh tokens, base64 keys</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.92;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="402" cy="234" r="4" fill="#1B4DE0"/>
      <circle cx="402" cy="234" r="4" fill="none" stroke="#1B4DE0" stroke-width="1.2">
        <animate attributeName="r" values="4;14" keyTimes="0;1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" keyTimes="0;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g class="sans" font-size="10.5" fill="#8A97A8">
    <text x="812" y="122" text-anchor="end">false positives</text>
  </g>
</svg>
