<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220"
     viewBox="0 0 920 220" role="img" aria-labelledby="title description">
  <title id="title">E.V Agent</title>
  <desc id="description">Sessions in, reviewed knowledge out. Nothing leaves the machine. Animated red and blue signal web on white.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>

    <linearGradient id="bnr-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E01B3D"/>
      <stop offset="1" stop-color="#1B4DE0"/>
    </linearGradient>

    <linearGradient id="bnr-paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFE"/>
    </linearGradient>

    <filter id="bnr-lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0E1622" flood-opacity="0.07"/>
    </filter>

    <radialGradient id="bnr-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B4DE0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1B4DE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="220" fill="#FFFFFF"/>
  <rect x="8" y="8" width="904" height="204" rx="18" fill="url(#bnr-paper)" stroke="#E2E8F2" filter="url(#bnr-lift)"/>

  <circle cx="742" cy="112" r="118" fill="url(#bnr-halo)"/>

  <g transform="translate(742 112)" fill="none" stroke-linecap="round">
    <g stroke="#DCE3EF" stroke-width="1">
      <circle r="30"/>
      <circle r="55"/>
      <circle r="80"/>
    </g>
    <g stroke="#E7ECF4" stroke-width="1">
      <path d="M0 -86 L0 86"/>
      <path d="M-86 0 L86 0"/>
      <path d="M-61 -61 L61 61"/>
      <path d="M-61 61 L61 -61"/>
    </g>

    <path d="M0 -80 A80 80 0 0 1 56.6 -56.6" stroke="#1B4DE0" stroke-width="2" opacity="0.55"
          stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" values="90;0;0;90" dur="7s" begin="0s"
               keyTimes="0;0.25;0.75;1" repeatCount="indefinite"/>
    </path>
    <path d="M-55 0 A55 55 0 0 1 -38.9 -38.9" stroke="#E01B3D" stroke-width="2" opacity="0.5"
          stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0;0;60" dur="7s" begin="1.4s"
               keyTimes="0;0.25;0.75;1" repeatCount="indefinite"/>
    </path>
    <path d="M21.2 21.2 A30 30 0 0 1 -21.2 21.2" stroke="#1B4DE0" stroke-width="2" opacity="0.45"
          stroke-dasharray="48" stroke-dashoffset="48">
      <animate attributeName="stroke-dashoffset" values="48;0;0;48" dur="7s" begin="2.8s"
               keyTimes="0;0.25;0.75;1" repeatCount="indefinite"/>
    </path>

    <g fill="#1B4DE0" stroke="none">
      <circle cx="0" cy="-80" r="3.5">
        <animate attributeName="r" values="3.5;5;3.5" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="56.6" cy="56.6" r="3">
        <animate attributeName="r" values="3;4.6;3" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-55" cy="0" r="3">
        <animate attributeName="r" values="3;4.6;3" dur="3.2s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#E01B3D" stroke="none">
      <circle cx="-38.9" cy="-38.9" r="3.5">
        <animate attributeName="r" values="3.5;5;3.5" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="0" r="3">
        <animate attributeName="r" values="3;4.4;3" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle r="4.5" fill="#1B4DE0">
      <animateMotion path="M0 0 L0 -80" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#E01B3D">
      <animateMotion path="M0 0 L-61 61" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(56 62)">
    <rect x="0" y="-22" width="46" height="4" rx="2" fill="url(#bnr-rule)"/>
    <text class="sans" x="0" y="34" font-size="46" font-weight="700" fill="#0E1622" letter-spacing="-1">
      E.V Agent
    </text>
    <text class="sans" x="1" y="70" font-size="16" fill="#4B5B70">
      Sessions in. Reviewed knowledge out.
    </text>

    <g transform="translate(1 96)">
      <rect x="0" y="-13" width="9" height="9" rx="2" fill="#E01B3D">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <text class="mono" x="18" y="-5" font-size="12.5" fill="#64748B" letter-spacing="0.6">
        NOTHING LEAVES THE MACHINE
      </text>
    </g>

    <g transform="translate(1 122)">
      <rect x="0" y="-13" width="9" height="9" rx="2" fill="#1B4DE0">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text class="mono" x="18" y="-5" font-size="12.5" fill="#64748B" letter-spacing="0.6">
        ZERO DEPENDENCIES · PYTHON 3.11+ · MIT
      </text>
    </g>
  </g>
</svg>
