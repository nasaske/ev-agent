<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="340"
     viewBox="0 0 920 340" role="img" aria-labelledby="title description">
  <title id="title">E.V Agent pipeline</title>
  <desc id="description">Transcripts are distilled, scrubbed of secrets, verified fail-closed, sent to a local model and written as candidate notes. Secrets are absorbed at the scrub stage; anything unexplained is diverted to quarantine and never sent.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>

    <linearGradient id="pl-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E01B3D"/>
      <stop offset="1" stop-color="#1B4DE0"/>
    </linearGradient>

    <filter id="pl-lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0E1622" flood-opacity="0.07"/>
    </filter>

    <filter id="pl-chip" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0E1622" flood-opacity="0.10"/>
    </filter>

    <path id="pl-rail" d="M52 150 H868"/>
    <path id="pl-toscrub" d="M52 150 H388"/>
    <path id="pl-toquarantine" d="M52 150 H532 V240"/>
  </defs>

  <rect width="920" height="340" fill="#FFFFFF"/>
  <rect x="8" y="8" width="904" height="324" rx="18" fill="#FFFFFF" stroke="#E2E8F2" filter="url(#pl-lift)"/>

  <g transform="translate(42 44)">
    <rect x="0" y="-11" width="28" height="3" rx="1.5" fill="url(#pl-rule)"/>
    <text class="mono" x="0" y="14" font-size="11.5" fill="#64748B" letter-spacing="1.6">PIPELINE</text>
  </g>

  <g class="mono" text-anchor="end">
    <text x="878" y="58" font-size="11" fill="#94A3B8" letter-spacing="0.8">LOCAL ONLY</text>
  </g>

  <line x1="52" y1="150" x2="868" y2="150" stroke="#E7ECF4" stroke-width="2"/>

  <g stroke="#CBD5E4" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M169 145 l5 5 l-5 5"/>
    <path d="M313 145 l5 5 l-5 5"/>
    <path d="M457 145 l5 5 l-5 5"/>
    <path d="M601 145 l5 5 l-5 5"/>
    <path d="M745 145 l5 5 l-5 5"/>
  </g>

  <path d="M532 182 V240" stroke="#F2C2CD" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>

  <g>
    <circle r="5" fill="#1B4DE0">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#pl-rail" xlink:href="#pl-rail"/></animateMotion>
    </circle>
    <circle r="5" fill="#1B4DE0">
      <animateMotion dur="9s" begin="3s" repeatCount="indefinite"><mpath href="#pl-rail" xlink:href="#pl-rail"/></animateMotion>
    </circle>
    <circle r="5" fill="#1B4DE0">
      <animateMotion dur="9s" begin="6s" repeatCount="indefinite"><mpath href="#pl-rail" xlink:href="#pl-rail"/></animateMotion>
    </circle>

    <circle r="5" fill="#E01B3D">
      <animateMotion dur="3.7s" begin="1.1s" repeatCount="indefinite"><mpath href="#pl-toscrub" xlink:href="#pl-toscrub"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.88;1" dur="3.7s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#E01B3D">
      <animateMotion dur="3.7s" begin="5.4s" repeatCount="indefinite"><mpath href="#pl-toscrub" xlink:href="#pl-toscrub"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.88;1" dur="3.7s" begin="5.4s" repeatCount="indefinite"/>
    </circle>

    <circle r="5.5" fill="#E01B3D">
      <animateMotion dur="6.4s" begin="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pl-toquarantine" xlink:href="#pl-toquarantine"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.9;0.96;1"
               dur="6.4s" begin="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="mono" font-size="11" letter-spacing="0.7" text-anchor="middle">

    <g>
      <rect x="42" y="118" width="116" height="64" rx="10" fill="#F6F8FB" stroke="#E2E8F2"/>
      <circle cx="148" cy="128" r="3" fill="#1B4DE0">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="155" fill="#0E1622">TRANSCRIPT</text>
      <text class="sans" x="100" y="200" font-size="10.5" fill="#8A97A8" letter-spacing="0">streamed, never loaded</text>
    </g>

    <g>
      <rect x="186" y="118" width="116" height="64" rx="10" fill="#F6F8FB" stroke="#E2E8F2"/>
      <circle cx="292" cy="128" r="3" fill="#1B4DE0">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <text x="244" y="155" fill="#0E1622">DISTIL</text>
      <text class="sans" x="244" y="200" font-size="10.5" fill="#8A97A8" letter-spacing="0">drop file bodies</text>
    </g>

    <g>
      <rect x="330" y="118" width="116" height="64" rx="10" fill="#FFF6F8" stroke="#F2C2CD"/>
      <rect x="330" y="118" width="116" height="64" rx="10" fill="none" stroke="#E01B3D" stroke-width="1.6" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.1;0.45;1" dur="4.3s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="436" cy="128" r="3" fill="#E01B3D">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="388" y="155" fill="#0E1622">SCRUB</text>
      <text class="sans" x="388" y="200" font-size="10.5" fill="#8A97A8" letter-spacing="0">redact known shapes</text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.34;0.46;1" dur="4.3s" begin="3.6s" repeatCount="indefinite"/>
        <rect x="352" y="86" width="72" height="20" rx="10" fill="#FFFFFF" stroke="#F2C2CD" filter="url(#pl-chip)"/>
        <text x="388" y="100" font-size="9.5" fill="#E01B3D" letter-spacing="0.4">redacted</text>
      </g>
    </g>

    <g>
      <rect x="474" y="118" width="116" height="64" rx="10" fill="#F6F8FB" stroke="#E2E8F2"/>
      <circle cx="580" cy="128" r="3" fill="#E01B3D">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="532" y="155" fill="#0E1622">VERIFY</text>
      <text class="sans" x="532" y="200" font-size="10.5" fill="#8A97A8" letter-spacing="0">fail closed</text>
    </g>

    <g>
      <rect x="618" y="118" width="116" height="64" rx="10" fill="#F4F7FF" stroke="#D3DEFA"/>
      <circle cx="724" cy="128" r="3" fill="#1B4DE0">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="676" y="155" fill="#0E1622">MODEL</text>
      <text class="sans" x="676" y="200" font-size="10.5" fill="#8A97A8" letter-spacing="0">local · keep_alive 0</text>
    </g>

    <g>
      <rect x="762" y="118" width="116" height="64" rx="10" fill="#F6F8FB" stroke="#E2E8F2"/>
      <circle cx="868" cy="128" r="3" fill="#1B4DE0">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="3.5s" repeatCount="indefinite"/>
      </circle>
      <text x="820" y="155" fill="#0E1622">NOTE</text>
      <text class="sans" x="820" y="200" font-size="10.5" fill="#8A97A8" letter-spacing="0">_inbox, you review</text>
    </g>

    <g>
      <rect x="474" y="240" width="116" height="44" rx="10" fill="#FFF6F8" stroke="#F2C2CD" stroke-dasharray="5 4"/>
      <text x="532" y="261" font-size="10.5" fill="#E01B3D">QUARANTINE</text>
      <text class="sans" x="532" y="276" font-size="9.5" fill="#C2708A" letter-spacing="0">never sent</text>
    </g>
  </g>

  <g class="sans" font-size="10.5" fill="#8A97A8">
    <circle cx="52" cy="308" r="4" fill="#1B4DE0"/>
    <text x="64" y="312">safe payload</text>
    <circle cx="168" cy="308" r="4" fill="#E01B3D"/>
    <text x="180" y="312">secret, absorbed before the model</text>
  </g>
</svg>
