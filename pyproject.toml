[project]
name = "ev-agent"
version = "0.1.0"
description = "Distil Claude Code and Codex sessions into reviewed skill notes, without leaving your machine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Davi Parma" }]
keywords = ["claude-code", "codex", "ollama", "obsidian", "local-first", "privacy"]
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/nasaske/ev-agent"
Issues = "https://github.com/nasaske/ev-agent/issues"

[project.scripts]
ev = "ev_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ev_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
